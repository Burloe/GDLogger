
name: Build GDLogger Download

on:
  push:
    branches:
      - main
    paths:
      - "addons/gdlogger/**"
      - ".github/workflows/build-addon.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gdlogger-download
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Create GDLogger ZIP
        run: |
          cd addons
          zip -r "$RUNNER_TEMP/GDLogger.zip" gdlogger
          unzip -l "$RUNNER_TEMP/GDLogger.zip"

      - name: Publish ZIP to downloads branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/publish"
          cd "$RUNNER_TEMP/publish"

          cp "$RUNNER_TEMP/GDLogger.zip" .

          git init -b downloads
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add GDLogger.zip
          git commit -m "Update GDLogger download"

          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/downloads
